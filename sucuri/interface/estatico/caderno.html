<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUCURI — caderno</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="sucuri.css">
<link rel="stylesheet" href="caderno.css">
</head>
<body>
<div class="app">

<header>
  <svg width="26" height="26" viewBox="0 0 100 100" aria-label="SUCURI">
    <path d="M68 28 C68 16, 44 14, 40 28 C36 42, 62 50, 62 66 C62 80, 40 82, 34 72"
          fill="none" stroke="#8FBE45" stroke-width="13" stroke-linecap="round"/>
    <circle cx="68" cy="28" r="9" fill="#8FBE45"/>
    <g transform="rotate(-31 34 72)"><rect x="27" y="65" width="14" height="14" rx="1.5" fill="#8FBE45"/></g>
  </svg>
  <span class="wordmark">SUCURI</span>
  <a class="modo" href="index.html">uma equação</a>
  <span class="arquivo" id="arquivo">caderno.tex</span>
</header>

<details class="convencoes caderno-convencoes" id="bloco-convencoes" open>
  <summary>Convenções do caderno</summary>
  <div class="campos">
    <label>Variável independente
      <input id="c-independente" type="text" spellcheck="false" placeholder="x">
    </label>
    <label>Variável temporal
      <input id="c-temporal" type="text" spellcheck="false" placeholder="t">
    </label>
    <label>Linha <span class="amostra">f'</span>
      <select id="c-linhas">
        <option value="">perguntar</option>
        <option value="derivative">é derivada</option>
        <option value="symbol">faz parte do nome</option>
      </select>
    </label>
    <label>Ponto <span class="amostra">\dot q</span>
      <select id="c-pontos">
        <option value="">perguntar</option>
        <option value="derivative">é derivada temporal</option>
        <option value="decoration">é só um acento</option>
      </select>
    </label>
    <label>Funções
      <input id="c-funcoes" type="text" spellcheck="false" placeholder="f, phi">
    </label>
    <label>Variáveis
      <input id="c-variaveis" type="text" spellcheck="false" placeholder="a, k">
    </label>
  </div>
  <p class="nota">Valem para o caderno inteiro. Mudar uma refaz tudo — o que já
    estava escrito passa a significar outra coisa, e mostrar as duas leituras
    ao mesmo tempo seria mostrar duas matemáticas.</p>
</details>

<main class="folha" id="folha"></main>

<footer>
  <span id="motor">SymPy</span>
  <span><kbd>Shift</kbd>+<kbd>Enter</kbd> executa</span>
  <span class="tempo" id="tempo">—</span>
</footer>

</div>

<script src="vendor/katex/katex.min.js"></script>
<script src="transporte.js"></script>
<script src="caderno.js"></script>
</body>
</html>
